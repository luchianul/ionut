name: Build si publica versiune noua

# La fiecare modificare a aplicatiei pe main se construiesc EXE + APK si se publica automat un Release nou.
# Aplicatia de pe PC (installer) si cea de pe telefon detecteaza singure versiunea noua.
on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'android-signing/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.1.${{ github.run_number }}

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm version "$VERSION" --no-git-tag-version
      - run: echo "window.APP_VERSION = '$VERSION';" > www/version.js
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Pontaj-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: echo "window.APP_VERSION = '$VERSION';" > www/version.js
      - run: npx cap add android
      - run: npx cap sync android
      - name: Versiune Android (versionCode creste la fiecare build, necesar pentru update)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Cheie de semnare fixa (aceeasi la fiecare build, altfel Android nu accepta actualizarea)
        run: |
          # configuram semnarea direct in build.gradle (copierea in ~/.android/debug.keystore nu era folosita de Gradle:
          # fiecare build isi genera o cheie noua, iar Android refuza instalarea peste versiunea veche)
          cp android-signing/pontaj.keystore android/app/pontaj.keystore
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          cfg = (
              "    signingConfigs {\n"
              "        fixa {\n"
              "            storeFile file('pontaj.keystore')\n"
              "            storePassword 'android'\n"
              "            keyAlias 'androiddebugkey'\n"
              "            keyPassword 'android'\n"
              "        }\n"
              "    }\n"
              "    buildTypes {\n"
              "        debug {\n"
              "            signingConfig signingConfigs.fixa\n"
              "        }\n"
          )
          s, n = re.subn(r'[ \t]*buildTypes\s*\{[ \t]*\n', lambda m: cfg, s, count=1)
          assert n == 1, 'nu gasesc buildTypes in build.gradle'
          open(p, 'w').write(s)
          PY
          grep -n -B1 -A3 "signingConfig" android/app/build.gradle
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verifica semnatura (trebuie sa fie cheia fixa, altfel build-ul pica)
        run: |
          A=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA256:" | head -1 | sed 's/^[[:space:]]*//')
          K=$(keytool -list -v -keystore android-signing/pontaj.keystore -storepass android | grep "SHA256:" | head -1 | sed 's/^[[:space:]]*//')
          echo "APK:   $A"
          echo "Cheie: $K"
          [ -n "$A" ] && [ "$A" = "$K" ]
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Pontaj.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pontaj-Android
          path: Pontaj.apk

  release:
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Pontaj ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
